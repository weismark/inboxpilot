name: Deploy InboxPilot to Netcup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inboxpilot-netcup-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: netcup-test
    timeout-minutes: 30
    steps:
      - name: Check approved Netcup revision
        shell: bash
        env:
          NETCUP_APPROVED_SHA: ${{ vars.NETCUP_APPROVED_SHA }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/feature/netcup-deployment &&
             "$NETCUP_APPROVED_SHA" =~ ^[0-9a-f]{40}$ &&
             "$NETCUP_APPROVED_SHA" == "$GITHUB_SHA" ]] ||
            { echo "::error::This revision is not approved for Netcup."; exit 1; }

      - name: Check out approved revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Build frontend for its Netcup route
        working-directory: frontend
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: /inboxpilot
          NEXT_PUBLIC_API_URL: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Deploy and verify Netcup release
        shell: bash
        env:
          NETCUP_DEPLOY_HOST: ${{ secrets.NETCUP_DEPLOY_HOST }}
          NETCUP_HOST_PUBLIC_KEY: ${{ secrets.NETCUP_HOST_PUBLIC_KEY }}
          NETCUP_DEPLOY_SSH_KEY: ${{ secrets.NETCUP_DEPLOY_SSH_KEY }}
          NETCUP_TARGET_ID: ${{ secrets.NETCUP_TARGET_ID }}
        run: bash .github/netcup/deploy.sh inboxpilot
